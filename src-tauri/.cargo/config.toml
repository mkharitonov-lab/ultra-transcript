# Windows: sherpa-onnx поставляется собранным со статической CRT (/MT) — остальное приложение
# собирается так же, иначе линковщик не сведёт библиотеки (LNK2038, несовпадение RuntimeLibrary).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# llama.cpp (llama-cpp-sys-2) берёт статическую CRT не из crt-static, а из этой переменной.
# На Mac и Linux она ни на что не влияет.
[env]
LLAMA_STATIC_CRT = "1"
