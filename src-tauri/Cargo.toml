[package]
name = "ultra-transcript"
version = "0.2.0"
description = "Расшифровка аудио и видео на вашем компьютере"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["mkharitonov-lab"]
edition = "2021"
default-run = "ultra-transcript"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ultra_transcript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: поля протокола идут в порядке меток шаблона, а не по алфавиту.
serde_json = { version = "1", features = ["preserve_order"] }
sherpa-onnx = "1.13.8"
# Прогресс диаризации есть только в C API: обёртка sherpa-onnx его не пробрасывает.
sherpa-onnx-sys = { version = "1.13.8", default-features = false }
anyhow = "1.0.104"
regex = "1.13.1"
zip = "8.6.0"
uuid = { version = "1.26.1", features = ["v4"] }
bzip2 = "0.6.1"
tar = "0.4.46"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4.45"
tauri-plugin-dialog = "2.8.0"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.23.1"
minijinja = { version = "2.24.0", features = ["loader"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
encoding_rs = "0.8.42"
# Импорт и экспорт справочников: чтение .xlsx/.xls/.ods, запись .xlsx, CSV.
calamine = "0.36.1"
rust_xlsxwriter = "0.99.1"
csv = "1.4.0"
# Диаризация pyannote community-1: ONNX Runtime берётся тот, что уже вшит в sherpa-onnx (второй не линкуется),
# kodama — иерархическая кластеризация для начального приближения VBx.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "alternative-backend"] }
kodama = "0.3"
# Nemotron 3: библиотека NeMo-Speech.cpp подгружается при выборе движка — без неё приложение работает.
libloading = "0.9"
# Запись с микрофона: CoreAudio на Mac, WASAPI на Windows.
cpal = "0.18"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Встроенная LLM: llama.cpp внутри процесса (без сервера и портов).
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["metal", "common"] }
# Уведомления через системный UserNotifications: запрос разрешения, щелчок по уведомлению.
# Своя подсказка у значка в строке меню (AppKit): системная не появляется, когда приложение в фоне.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std", "block2", "NSArray", "NSBundle", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSString",
  "NSTimer", "NSUUID", "NSValue",
] }
# Звук компьютера: глобальный process tap (см. systap.rs).
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "NSButton", "NSColor", "NSControl", "NSFont", "NSGraphics", "NSPanel", "NSResponder", "NSScreen",
  "NSStatusBarButton", "NSStatusItem", "NSText", "NSTextField", "NSView", "NSVisualEffectView", "NSWindow",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest",
  "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter",
] }
block2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["vulkan", "common"] }
tauri-plugin-notification = "2"
