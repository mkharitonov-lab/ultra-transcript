# Сборка установщиков: Mac (Apple Silicon, .dmg) и Windows (x64, .msi и .exe).
# По тегу v* собирает обе и выкладывает черновик релиза на GitHub; вручную (Run workflow) —
# только собирает, установщики — в артефактах запуска.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # FFmpeg в поставке. Mac: свой минимальный (только звук, LGPL), собирается из исходников.
      - name: FFmpeg (Mac)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        id: ffmpeg-cache
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('src-tauri/scripts/build-ffmpeg.sh') }}
      - if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: src-tauri/scripts/build-ffmpeg.sh
        env:
          FFMPEG_BUILD_DIR: ${{ runner.temp }}/ffmpeg-build

      # Windows: готовая LGPL-сборка BtbN (с libopus — им сжимается архив записи).
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip
          unzip -q ffmpeg.zip
          mkdir -p src-tauri/binaries
          cp ffmpeg-*/bin/ffmpeg.exe src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe
          src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe -hide_banner -encoders | grep -q libopus

      # Встроенная LLM на Windows работает через Vulkan: для сборки нужен Vulkan SDK.
      - name: Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.321.1
          install_runtime: false
          cache: true
          stripdown: true

      - uses: tauri-apps/tauri-action@action-v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Ультра Транскрибатор ${{ github.ref_name }}"
          releaseBody: "Установка и первый запуск — в README."
          releaseDraft: true
          # GitHub выбрасывает из имён файлов кириллицу («Ультра Транскрибатор» → «_0.2.0_aarch64.dmg»).
          releaseAssetNamePattern: "UltraTranscript_[version]_[arch][setup][ext]"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
