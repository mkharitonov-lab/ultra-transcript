# Сборка установщиков: Mac (Apple Silicon, .dmg) и Windows (x64, установщик NSIS .exe).
# По тегу v* собирает обе и выкладывает черновик релиза на GitHub; вручную (Run workflow) —
# только собирает, установщики — в артефактах запуска.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Черновик релиза создаётся заранее: tauri-action v1 сам создать его не может
  # («Resource not accessible by integration»), а загрузить файлы в готовый — может.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Ультра Транскрибатор $TAG" --notes "Установка и первый запуск — в README."

  build:
    needs: release
    # По тегу — после черновика релиза; вручную — без него.
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            nemo_config: src-tauri/tauri.nemotron.conf.json
          # Только NSIS: WiX собирает .msi в кодировке 1252 и падает на кириллице в названии.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            nemo_config: src-tauri/tauri.nemotron.windows.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Windows: папка сборки — короткий C:\t. Иначе пути вложенной сборки llama.cpp (шейдеры Vulkan)
      # длиннее 260 символов и компилятор не открывает свои же файлы (C1083).
      - if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_DIR=C:/t" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Кэш папки сборки — только на Mac: на Windows она вне репозитория.
          cache-targets: ${{ runner.os != 'Windows' }}

      # FFmpeg в поставке. Mac: свой минимальный (только звук, LGPL), собирается из исходников.
      - name: FFmpeg (Mac)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        id: ffmpeg-cache
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('src-tauri/scripts/build-ffmpeg.sh') }}
      - if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: src-tauri/scripts/build-ffmpeg.sh
        env:
          FFMPEG_BUILD_DIR: ${{ runner.temp }}/ffmpeg-build

      # Windows: готовая LGPL-сборка BtbN (с libopus — им сжимается архив записи).
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip
          unzip -q ffmpeg.zip
          mkdir -p src-tauri/binaries
          cp ffmpeg-*/bin/ffmpeg.exe src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe
          src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe -hide_banner -encoders | grep -q libopus

      # Встроенная LLM на Windows работает через Vulkan: для сборки нужен Vulkan SDK.
      - name: Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.321.1
          install_runtime: false
          cache: true
          stripdown: true

      # llama.cpp на Windows — через Ninja в окружении MSVC: генератор Visual Studio 2026
      # не передаёт компилятор вложенной сборке шейдеров Vulkan (No CMAKE_C_COMPILER).
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6
      - if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      # Nemotron 3: библиотека NeMo-Speech.cpp, из исходников (готовых сборок с этой моделью нет).
      # Если не собралась — установщик выходит без неё, движок просто не показывается.
      - name: NeMo-Speech.cpp (кэш)
        uses: actions/cache@v6
        id: nemo-cache
        with:
          path: src-tauri/target/nemo-speech
          key: nemo-${{ matrix.target }}-${{ hashFiles('src-tauri/scripts/build-nemo-speech.sh') }}
      - name: NeMo-Speech.cpp
        id: nemo
        continue-on-error: true
        shell: bash
        env:
          NEMO_BUILD_DIR: ${{ runner.temp }}/nemo-build
        run: |
          if [ "${{ steps.nemo-cache.outputs.cache-hit }}" != "true" ]; then
            if [ "$RUNNER_OS" = macOS ]; then brew install ninja; fi
            src-tauri/scripts/build-nemo-speech.sh
          fi
          ls src-tauri/target/nemo-speech/lib src-tauri/target/nemo-speech/bin 2>/dev/null || true

      - uses: tauri-apps/tauri-action@action-v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
            ${{ steps.nemo.outcome == 'success' && format('--config {0}', matrix.nemo_config) || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Ультра Транскрибатор ${{ github.ref_name }}"
          releaseBody: "Установка и первый запуск — в README."
          releaseDraft: true
          # GitHub выбрасывает из имён файлов кириллицу («Ультра Транскрибатор» → «_0.2.0_aarch64.dmg»).
          releaseAssetNamePattern: "UltraTranscript_[version]_[arch][setup][ext]"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), '\n') }}
